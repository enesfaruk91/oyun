<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3b2a6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/ikon/ikon-192.png">
<title>OGEDAY 3D — Anne Babadan Kaçmacılık</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b2a1e; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #dunya3d { position: fixed; inset: 0; z-index: 0; }
  #oyun { position: fixed; inset: 0; z-index: 1; }
  /* Dikey telefon: sahne 90° döner (oyun.js boyutla, --ekW/--ekH pencere boyutu) */
  html.donuk canvas, html.donuk #dunya3d, html.donuk #oyun { inset: auto; left: 0; top: 0; width: var(--ekH); height: var(--ekW); transform-origin: 0 0; transform: translateX(var(--ekW)) rotate(90deg); }
</style>
</head>
<body>
<div id="yukleniyor" style="position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#3b2a6b;color:#ffe14d;font:bold 26px 'Trebuchet MS',sans-serif;text-align:center;transition:opacity .4s">
  <div style="width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd36b,#f07a2e);animation:ziplat .6s ease-in-out infinite alternate"></div>
  <div>Anne Babadan Kaçmacılık</div>
  <div style="font-size:15px;color:#cfd8ff">Yükleniyor…</div>
  <style>@keyframes ziplat{from{transform:translateY(0)}to{transform:translateY(-26px)}}</style>
</div>
<canvas id="oyun"></canvas>
<script src="vendor/three.min.js?v=20261025-1328"></script>
<script src="assets/modeller.js?v=20261025-1328"></script>
<script src="js/bolum.js?v=20261025-1328"></script>

<script src="js/cizim.js?v=20261025-1328"></script>

<script src="js/oyuncu.js?v=20261025-1328"></script>

<script src="js/kedi.js?v=20261025-1328"></script>
<script src="js/misafir.js?v=20261025-1328"></script><script src="js/bebek.js?v=20261025-1328"></script>
<script src="js/arayuz.js?v=20261025-1328"></script>
<script src="js/girdi.js?v=20261025-1328"></script>

<script src="js/oyun.js?v=20261025-1328"></script>
<script>
  // Yükleniyor ekranını ilk çizimden sonra kaldır
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    var y = document.getElementById('yukleniyor'); if (!y) return;
    y.style.opacity = '0'; setTimeout(function () { y.remove(); }, 450);
  }); });
</script>
</body>
</html>
